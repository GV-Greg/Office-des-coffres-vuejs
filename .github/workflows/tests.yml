name: Tests

# Déclencheurs volontairement sans `push` : sur main, les tests sont appelés par
# deploy.yml via workflow_call, qui bloque le déploiement s'ils échouent. Les garder
# aussi sur `push` les ferait tourner deux fois pour rien à chaque mise en prod.
on:
  pull_request:
  workflow_call:

jobs:
  frontend-tests:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_API_ENDPOINT_PROD: "http://localhost"
