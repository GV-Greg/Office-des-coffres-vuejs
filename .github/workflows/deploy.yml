name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Le déploiement est conditionné aux tests : jusqu'ici les deux workflows se
  # déclenchaient en parallèle sur un push, donc un commit aux tests rouges partait
  # quand même en prod. Réutilise tests.yml plutôt que d'en recopier les étapes,
  # pour qu'il n'existe qu'une seule définition de la suite de tests.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet nécessaire pour diffuser whatsNew.json via github.event.before

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_ENDPOINT_PROD: ${{ secrets.VITE_API_ENDPOINT_PROD }}

      - name: Deploy to O2Switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /front/

      - name: Annoncer la Chronique / le Registre des Réparations sur Discord
        if: success() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        env:
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          DISCORD_FIXES_WEBHOOK_URL: ${{ secrets.DISCORD_FIXES_WEBHOOK_URL }}
        run: |
          git show ${{ github.event.before }}:src/data/whatsNew.json > /tmp/whatsNew.old.json 2>/dev/null || echo '[]' > /tmp/whatsNew.old.json
          node scripts/whatsNewAnnounce.mjs --old /tmp/whatsNew.old.json --new src/data/whatsNew.json

      - name: Notifier le salon admin/mod (succès ou échec)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_ADMIN_WEBHOOK_URL
            if (!webhook) { core.info('DISCORD_ADMIN_WEBHOOK_URL non configuré — notification ignorée.'); return }
            const status = '${{ job.status }}'
            const commit = context.payload.head_commit
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = {
              content: status === 'success'
                ? `✅ **Office des coffres — frontend** déployé avec succès`
                : `❌ **Office des coffres — frontend** — échec du déploiement`,
              embeds: [{
                color: status === 'success' ? 0x22C55E : 0xDC2626,
                description: (commit?.message ?? '(déclenchement manuel, pas de commit associé)').slice(0, 500),
                url: commit?.url ?? runUrl,
                fields: [{ name: 'Run', value: runUrl }]
              }]
            }
            try {
              const res = await fetch(webhook, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
              if (!res.ok) core.warning(`Discord a répondu ${res.status}`)
            } catch (err) {
              core.warning(`Notification Discord admin échouée: ${err.message}`)
            }
