name: Deploy to O2Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Le déploiement est conditionné aux tests : jusqu'ici les deux workflows se
  # déclenchaient en parallèle sur un push, donc un commit aux tests rouges partait
  # quand même en prod. Réutilise tests.yml plutôt que d'en recopier les étapes,
  # pour qu'il n'existe qu'une seule définition de la suite de tests.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet nécessaire pour diffuser whatsNew.json via github.event.before

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_ENDPOINT_PROD: ${{ secrets.VITE_API_ENDPOINT_PROD }}

      - name: Deploy to O2Switch
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /front/

      # Performance #7 : filet de sécurité contre une régression silencieuse des headers de
      # cache — override PowerBoost, .htaccess supprimé/mal déployé, changement de config vhost.
      # Les noms d'assets sont hashés par Vite (voir public/.htaccess) : on les redécouvre depuis
      # l'index.html réellement déployé plutôt que de les coder en dur.
      - name: Vérifier les headers de cache sur les assets déployés
        run: |
          # Retry plutôt qu'un sleep fixe : premier run en prod (12/08/2026) tombé en faux
          # négatif après seulement 5s (site vérifié intact juste après coup, curl manuel
          # immédiat en dehors du runner OK) — aléa réseau côté runner GitHub Actions, pas une
          # vraie régression. -sS (pas juste -s) pour que les erreurs curl restent visibles.
          ASSET_PATH=""
          HTML=""
          for attempt in 1 2 3 4 5 6; do
            HTML=$(curl -sS --max-time 10 https://officedescoffres.creacube.be/ || true)
            ASSET_PATH=$(echo "$HTML" | grep -oE '/assets/index-[^"]*\.js' | head -1)
            if [ -n "$ASSET_PATH" ]; then
              break
            fi
            echo "Tentative $attempt/6 : asset introuvable, nouvel essai dans 5s..."
            sleep 5
          done

          if [ -z "$ASSET_PATH" ]; then
            echo "::error::Impossible de trouver l'asset JS principal dans l'index.html déployé après 6 tentatives (30s)."
            echo "--- Réponse HTML reçue (dernière tentative) ---"
            echo "$HTML"
            exit 1
          fi
          echo "Asset détecté (tentative $attempt/6) : $ASSET_PATH"

          ASSET_HEADERS=$(curl -sSI --max-time 10 "https://officedescoffres.creacube.be${ASSET_PATH}")
          echo "$ASSET_HEADERS"
          if ! echo "$ASSET_HEADERS" | grep -qi 'cache-control:.*public.*max-age=31536000.*immutable'; then
            echo "::error::Cache-Control absent ou incorrect sur ${ASSET_PATH} — vérifier public/.htaccess et le cache PowerBoost O2Switch (voir admin/suivi/performance.md #1/#3)."
            exit 1
          fi

          HTML_HEADERS=$(curl -sSI --max-time 10 https://officedescoffres.creacube.be/)
          echo "$HTML_HEADERS"
          if ! echo "$HTML_HEADERS" | grep -qi 'cache-control:.*no-cache'; then
            echo "::error::Cache-Control: no-cache absent sur index.html — un cache long dessus servirait des références obsolètes aux assets hashés."
            exit 1
          fi

          echo "✅ Headers de cache conformes sur les assets et index.html."

      - name: Annoncer la Chronique / le Registre des Réparations sur Discord
        if: success() && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        env:
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          DISCORD_FIXES_WEBHOOK_URL: ${{ secrets.DISCORD_FIXES_WEBHOOK_URL }}
        run: |
          git show ${{ github.event.before }}:src/data/whatsNew.json > /tmp/whatsNew.old.json 2>/dev/null || echo '[]' > /tmp/whatsNew.old.json
          node scripts/whatsNewAnnounce.mjs --old /tmp/whatsNew.old.json --new src/data/whatsNew.json

      - name: Notifier le salon admin/mod (succès ou échec)
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_ADMIN_WEBHOOK_URL
            if (!webhook) { core.info('DISCORD_ADMIN_WEBHOOK_URL non configuré — notification ignorée.'); return }
            const status = '${{ job.status }}'
            const commit = context.payload.head_commit
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = {
              content: status === 'success'
                ? `✅ **Office des coffres — frontend** déployé avec succès`
                : `❌ **Office des coffres — frontend** — échec du déploiement`,
              embeds: [{
                color: status === 'success' ? 0x22C55E : 0xDC2626,
                description: (commit?.message ?? '(déclenchement manuel, pas de commit associé)').slice(0, 500),
                url: commit?.url ?? runUrl,
                fields: [{ name: 'Run', value: runUrl }]
              }]
            }
            try {
              const res = await fetch(webhook, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
              if (!res.ok) core.warning(`Discord a répondu ${res.status}`)
            } catch (err) {
              core.warning(`Notification Discord admin échouée: ${err.message}`)
            }
